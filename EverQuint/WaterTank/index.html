<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tank</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <h1 class="title">Water tank</h1>
    <h3 class="sub-title">
        Instructions:
        Select the number of blocks and
        click on a block at the required
        unit height.
    </h3>


    <main>

        <section>

            <h2>Input</h2>


            <div class="controls">

                <label for="blockCount">
                    Number of blocks
                </label>


                <input id="blockCount" type="number" min="2" max="50" value="10" aria-describedby="blockCountError">


                <p id="blockCountError" class="input-error" role="alert"></p>


                <button id="generateButton">
                    Generate Blocks
                </button>

            </div>


            <div class="svg-container">
                <svg id="inputTank" width="600" height="300" viewBox="0 0 600 300"></svg>
            </div>

            <button id="computeButton">
                Compute Water
            </button>

        </section>


        <section>

            <h2>Result</h2>


            <div class="svg-container">
                <svg id="resultTank" width="600" height="300" viewBox="0 0 600 300"></svg>
            </div>


            <p id="result"></p>

        </section>

    </main>

    <script defer type="module" src="./js/app.js"></script>
</body>

</html>
